---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "kubenuts-secret-store"
spec:
  dependsOn:
  - namespace: "kubenuts"
    name: external-secrets-helm-release
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/pg02/manifests/kubenuts/kubenuts-secret-store"
  targetNamespace: "kubenuts"
  healthChecks:
  - apiVersion: v1
    kind: ServiceAccount
    namespace: "kubenuts"
    name: "kubenuts-secret-store"
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    namespace: "kubenuts"
    name: "kubenuts"
