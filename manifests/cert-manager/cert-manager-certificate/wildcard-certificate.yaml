---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: "cert-manager"
  name: "pg02-wildcard-cert"
spec:
  secretName: "pg02-wildcard-cert"
  secretTemplate:
    annotations:
      "reflector.v1.k8s.emberstack.com/reflection-allowed": "true"
      "reflector.v1.k8s.emberstack.com/reflection-auto-enabled": "true"
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: "kubenuts"
  commonName: "*.pg02.narvar.qa"
  dnsNames:
  - "*.pg02.narvar.qa"
  - "pg02.narvar.qa"
  isCA: false
  usages:
  - server auth
