---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "victoria-logs"
  name: "victoria-logs-cluster"
spec:
  interval: 30m
  timeout: 15m
  releaseName: "victoria-logs-cluster"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "victoria-logs"
        name: "victoria-logs"
      chart: victoria-logs-cluster
      version: "0.2.8"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "victoria-logs-cluster-helm-values"
    valuesKey: values.yaml
