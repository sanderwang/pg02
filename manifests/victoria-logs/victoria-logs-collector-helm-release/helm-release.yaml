---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "victoria-logs"
  name: "victoria-logs-collector"
spec:
  interval: 30m
  timeout: 15m
  releaseName: "victoria-logs-collector"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "victoria-logs"
        name: "victoria-logs"
      chart: victoria-logs-collector
      version: "0.3.7"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "victoria-logs-collector-helm-values"
    valuesKey: values.yaml
