---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "victoria-logs"
  name: "victoria-logs-collector-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/victoria-logs/victoria-logs-collector-helm-values"
  targetNamespace: "victoria-logs"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "victoria-logs"
    name: "victoria-logs-collector-helm-values"
