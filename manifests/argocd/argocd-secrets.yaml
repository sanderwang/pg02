---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "argocd"
  name: "argocd-secrets"
spec:
  dependsOn:
  - namespace: "argocd"
    name: "argocd-secret-store"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/argocd/argocd-secrets"
  targetNamespace: "argocd"
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    namespace: "argocd"
    name: "argocd-secret"
  - apiVersion: v1
    kind: Secret
    namespace: "argocd"
    name: "argocd-secret"
