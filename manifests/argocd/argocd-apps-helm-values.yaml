---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "argocd"
  name: "argocd-apps-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/argocd/argocd-apps-helm-values"
  targetNamespace: "argocd"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "argocd"
    name: "argocd-apps-helm-values"
