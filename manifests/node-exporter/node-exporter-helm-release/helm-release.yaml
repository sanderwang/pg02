---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "telemetry"
  name: "node-exporter"
spec:
  interval: 30m
  timeout: 15m
  releaseName: "node-exporter"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "telemetry"
        name: "node-exporter"
      chart: prometheus-node-exporter
      version: "4.56.3"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "node-exporter-helm-values"
    valuesKey: values.yaml
