---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "atlantis-webhook-gateway"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/atlantis/atlantis-webhook-gateway"
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "kubenuts"
    name: "atlantis-webhook"
