---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "atlantis-webhook-route"
spec:
  dependsOn:
  - namespace: "kubenuts"
    name: "atlantis-webhook-gateway"
  - namespace: "kubenuts"
    name: "atlantis-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/atlantis/atlantis-webhook-route"
  healthChecks:
  - apiVersion: v1
    kind: Service
    namespace: "kubenuts"
    name: "atlantis-webhook"
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "kubenuts"
    name: "atlantis-webhook"
