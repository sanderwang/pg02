---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "kubenuts"
  name: "atlantis"
spec:
  interval: 15m
  timeout: 10m
  releaseName: "atlantis"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "kubenuts"
        name: "atlantis"
      chart: atlantis
      version: "6.16.0"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "atlantis-helm-values"
    valuesKey: values.yaml
