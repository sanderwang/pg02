---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "atlantis-helm-release"
spec:
  dependsOn:
  - namespace: "kubenuts"
    name: "atlantis-helm-values"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/atlantis/atlantis-helm-release"
  targetNamespace: "kubenuts"
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    namespace: "kubenuts"
    name: "atlantis"
