---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-agent"
spec:
  dependsOn:
  - namespace: "victoria-metrics"
    name: "victoria-metrics-crds-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/victoria-metrics/victoria-metrics-agent"
  targetNamespace: "victoria-metrics"
  healthChecks:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMAgent
    namespace: "victoria-metrics"
    name: "victoria-metrics"
