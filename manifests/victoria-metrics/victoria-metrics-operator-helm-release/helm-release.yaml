---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-operator"
spec:
  interval: 30m
  timeout: 15m
  releaseName: "victoria-metrics-operator"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "victoria-metrics"
        name: "victoria-metrics"
      chart: victoria-metrics-operator
      version: "0.67.3"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "victoria-metrics-operator-helm-values"
    valuesKey: values.yaml
