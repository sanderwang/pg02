---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-scrape-targets"
spec:
  dependsOn:
  - namespace: "victoria-metrics"
    name: "victoria-metrics-crds-helm-release"
  - namespace: "victoria-metrics"
    name: "victoria-metrics-operator-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/victoria-metrics/victoria-metrics-scrape-targets"
  targetNamespace: "victoria-metrics"
  healthChecks:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMNodeScrape
    namespace: "victoria-metrics"
    name: "kubelet-cadvisor"
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMNodeScrape
    namespace: "victoria-metrics"
    name: "kubelet-core"
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    namespace: "victoria-metrics"
    name: kube-apiserver
