---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics"
spec:
  extraArgs:
    envflag.enable: "true"
    envflag.prefix: VM_
  replicaCount: 1
  httpRoute:
    hostnames:
    - "metrics.pg02.narvar.qa"
    name: "victoria-metrics"
    parentRefs:
    - name: kubenuts-internal
      namespace: kubenuts
      sectionName: https
  logFormat: json
  logLevel: WARN
  podDisruptionBudget:
    maxUnavailable: 1
  port: "8427"
  selectAllByDefault: true
  serviceScrapeSpec:
    endpoints:
      - port: http
        relabelConfigs:
        - replacement: vmauth
          targetLabel: job
  unauthorizedUserAccessSpec:
    url_map:
    - src_paths: ["/insert/.*"]
      url_prefix: http://victoria-metrics-insert.victoria-metrics:8480
    - src_paths: ["/select/.*"]
      url_prefix: http://victoria-metrics-select.victoria-metrics:8481
