---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-cluster-helm-release"
spec:
  dependsOn:
  - namespace: "victoria-metrics"
    name: "victoria-metrics-cluster-helm-values"
  - namespace: "victoria-metrics"
    name: "victoria-metrics-crds-helm-release"
  - namespace: "victoria-metrics"
    name: "victoria-metrics-operator-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/victoria-metrics/victoria-metrics-cluster-helm-release"
  targetNamespace: "victoria-metrics"
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    namespace: "victoria-metrics"
    name: "victoria-metrics-cluster"
