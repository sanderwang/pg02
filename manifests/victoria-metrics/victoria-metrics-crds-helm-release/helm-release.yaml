---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-crds"
spec:
  interval: 30m
  timeout: 10m
  releaseName: "victoria-metrics-crds"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "victoria-metrics"
        name: "victoria-metrics"
      chart: victoria-metrics-operator-crds
      version: "0.14.0"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values: {}
