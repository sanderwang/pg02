---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "victoria-metrics"
  name: "victoria-metrics-secret-store"
spec:
  dependsOn:
  - namespace: kubenuts
    name: external-secrets-helm-release
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/victoria-metrics/victoria-metrics-secret-store"
  targetNamespace: "victoria-metrics"
  healthChecks:
  - apiVersion: v1
    kind: ServiceAccount
    namespace: "victoria-metrics"
    name: "victoria-metrics-secret-store"
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    namespace: "victoria-metrics"
    name: "victoria-metrics"
