---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "flux-system"
  name: "flux-metrics-dashboards"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/flux-metrics/flux-metrics-dashboards"
  targetNamespace: "flux-system"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "flux-system"
    name: "flux-metrics-dashboard-control-plan"
