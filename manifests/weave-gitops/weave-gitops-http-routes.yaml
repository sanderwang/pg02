---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "weave-gitops-http-routes"
spec:
  dependsOn:
  - namespace: kubenuts
    name: kubenuts-internal-gateway
  - namespace: "kubenuts"
    name: "weave-gitops-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/weave-gitops/weave-gitops-http-routes"
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "kubenuts"
    name: "weave-gitops"
