---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "telemetry"
  name: "kube-state-metrics-helm-release"
spec:
  dependsOn:
  - namespace: "telemetry"
    name: "kube-state-metrics-helm-values"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/kube-state-metrics/kube-state-metrics-helm-release"
  targetNamespace: "telemetry"
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    namespace: "telemetry"
    name: "kube-state-metrics"
