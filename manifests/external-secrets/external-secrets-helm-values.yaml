---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "external-secrets-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/external-secrets/external-secrets-helm-values"
  targetNamespace: "kubenuts"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "kubenuts"
    name: "external-secrets-helm-values"
