---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "telemetry"
  name: "opencost-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/opencost/opencost-helm-values"
  targetNamespace: "telemetry"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "telemetry"
    name: "opencost-helm-values"
