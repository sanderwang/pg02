---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "telemetry"
  name: "prometheus-crds"
spec:
  interval: 30m
  timeout: 15m
  releaseName: "prometheus-crds"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "telemetry"
        name: "prometheus-crds"
      chart: prometheus-operator-crds
      version: "31.0.1"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values: {}
