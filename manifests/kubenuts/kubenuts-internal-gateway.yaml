---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "kubenuts"
  name: "kubenuts-internal-gateway"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/kubenuts/kubenuts-internal-gateway"
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "kubenuts"
    name: "kubenuts-internal"
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "kubenuts"
    name: "kubenuts-internal-http-redirect"
