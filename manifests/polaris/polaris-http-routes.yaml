---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "polaris"
  name: "polaris-http-routes"
spec:
  dependsOn:
  - namespace: kubenuts
    name: kubenuts-internal-gateway
  - namespace: "polaris"
    name: "polaris-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/polaris/polaris-http-routes"
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "polaris"
    name: "polaris-dashboard"
