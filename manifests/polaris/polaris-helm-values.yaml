---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "polaris"
  name: "polaris-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/polaris/polaris-helm-values"
  targetNamespace: "polaris"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "polaris"
    name: "polaris-helm-values"
