---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "polaris"
  name: "polaris"
spec:
  interval: 15m
  timeout: 10m
  releaseName: "polaris"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "polaris"
        name: "polaris"
      chart: polaris
      version: "6.0.0"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "polaris-helm-values"
    valuesKey: values.yaml
