---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "polaris"
  name: "polaris-helm-release"
spec:
  dependsOn:
  - namespace: "polaris"
    name: "polaris-helm-values"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/polaris/polaris-helm-release"
  targetNamespace: "polaris"
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    namespace: "polaris"
    name: "polaris"
