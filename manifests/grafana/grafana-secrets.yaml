---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "telemetry"
  name: "grafana-secrets"
spec:
  dependsOn:
  - namespace: "telemetry"
    name: "telemetry-secret-store"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/grafana/grafana-secrets"
  targetNamespace: "telemetry"
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    namespace: "telemetry"
    name: "grafana"
  - apiVersion: v1
    kind: Secret
    namespace: "telemetry"
    name: "grafana"
