---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "linkerd"
  name: "linkerd-license"
spec:
  dependsOn:
  - namespace: "linkerd"
    name: "linkerd-secret-store"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/linkerd/linkerd-license"
  targetNamespace: "linkerd"
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    namespace: "linkerd"
    name: "linkerd-license"
  - apiVersion: v1
    kind: Secret
    namespace: "linkerd"
    name: "linkerd-license"
