---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "linkerd"
  name: "linkerd-webhook-certificates"
spec:
  dependsOn:
  - namespace: cert-manager
    name: cert-manager-helm-release
  - namespace: "linkerd"
    name: "linkerd-secret-store"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/linkerd/linkerd-webhook-certificates"
  targetNamespace: "linkerd"
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      namespace: "linkerd"
      name: "linkerd-webhook-issuer-cert"
    - apiVersion: v1
      kind: Secret
      namespace: "linkerd"
      name: "linkerd-webhook-issuer-cert"
    - apiVersion: cert-manager.io/v1
      kind: Issuer
      namespace: "linkerd"
      name: "linkerd-webhook-issuer"
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      namespace: "linkerd"
      name: "linkerd-policy-validator"
    - apiVersion: v1
      kind: Secret
      namespace: "linkerd"
      name: "linkerd-policy-validator-k8s-tls"
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      namespace: "linkerd"
      name: "linkerd-proxy-injector"
    - apiVersion: v1
      kind: Secret
      namespace: "linkerd"
      name: "linkerd-proxy-injector-k8s-tls"
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      namespace: "linkerd"
      name: "linkerd-sp-validator"
    - apiVersion: v1
      kind: Secret
      namespace: "linkerd"
      name: "linkerd-sp-validator-k8s-tls"
