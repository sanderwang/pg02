---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: "linkerd"
  name: "linkerd-webhook-issuer-cert"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: "linkerd"
  target:
    name: "linkerd-webhook-issuer-cert"
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "linkerd-[a-z]+"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "linkerd-[a-z]+"
  data:
  - secretKey: tls.crt
    remoteRef:
      key: "pg02/linkerd/webhook-issuer-cert"
      property: cert.pem
  - secretKey: tls.key
    remoteRef:
      key: "pg02/linkerd/webhook-issuer-cert"
      property: key.pem
