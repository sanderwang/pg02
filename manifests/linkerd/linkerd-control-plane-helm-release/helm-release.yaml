---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "linkerd"
  name: "linkerd-control-plane"
spec:
  dependsOn:
  - namespace: "linkerd"
    name: "linkerd-crds"
  interval: 30m
  timeout: 15m
  releaseName: "linkerd-control-plane"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "linkerd"
        name: "linkerd"
      chart: "linkerd-control-plane"
      version: "2026.6.3"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "linkerd-control-plane-helm-values"
    valuesKey: values.yaml
  - kind: Secret
    name: "linkerd-root-cert"
    valuesKey: tls.crt
    targetPath: identityTrustAnchorsPEM
  - kind: Secret
    name: linkerd-webhook-issuer-cert
    valuesKey: tls.crt
    targetPath: policyValidator.caBundle
  - kind: Secret
    name: linkerd-webhook-issuer-cert
    valuesKey: tls.crt
    targetPath: proxyInjector.caBundle
  - kind: Secret
    name: linkerd-webhook-issuer-cert
    valuesKey: tls.crt
    targetPath: profileValidator.caBundle
