---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "linkerd"
  name: "linkerd-crds"
spec:
  interval: 30m
  timeout: 10m
  releaseName: "linkerd-crds"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "linkerd"
        name: "linkerd"
      chart: "linkerd-crds"
      version: "2026.6.3"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    installGatewayAPI: false
