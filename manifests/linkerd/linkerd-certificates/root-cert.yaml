---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: "linkerd"
  name: "linkerd-root-cert"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: "linkerd"
  target:
    name: "linkerd-root-cert"
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: "pg02/linkerd/root-cert"
      property: cert.pem
  - secretKey: tls.key
    remoteRef:
      key: "pg02/linkerd/root-cert"
      property: key.pem
