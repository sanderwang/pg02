---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "linkerd-viz"
  name: "linkerd-viz-scrape-configs"
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/linkerd-viz/linkerd-viz-scrape-configs"
  prune: true
  targetNamespace: "linkerd-viz"
  healthChecks:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: ScrapeConfig
    namespace: "linkerd-viz"
    name: linkerd-controller
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: ScrapeConfig
    namespace: "linkerd-viz"
    name: linkerd-proxy
