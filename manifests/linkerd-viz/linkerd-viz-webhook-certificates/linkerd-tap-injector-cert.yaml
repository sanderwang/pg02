---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  namespace: "linkerd-viz"
  name: "linkerd-viz-tap-injector"
spec:
  secretName: tap-injector-k8s-tls
  duration: 720h
  renewBeforePercentage: 33
  issuerRef:
    kind: Issuer
    name: "linkerd-viz-webhook-issuer"
  commonName: "tap-injector.linkerd-viz.svc"
  dnsNames:
  - "tap-injector.linkerd-viz.svc"
  privateKey:
    algorithm: ECDSA
  isCA: false
  usages:
  - server auth
