---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "linkerd-viz"
  name: "linkerd-viz-http-routes"
spec:
  dependsOn:
  - namespace: kubenuts
    name: kubenuts-internal-gateway
  - namespace: "linkerd-viz"
    name: "linkerd-viz-helm-release"
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/linkerd-viz/linkerd-viz-http-routes"
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "linkerd-viz"
    name: "linkerd-viz"
