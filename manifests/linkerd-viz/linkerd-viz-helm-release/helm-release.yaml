---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "linkerd-viz"
  name: "linkerd-viz"
spec:
  dependsOn:
  - namespace: linkerd
    name: linkerd-control-plane
  interval: 30m
  timeout: 15m
  releaseName: "linkerd-viz"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "linkerd-viz"
        name: "linkerd-viz"
      chart: linkerd-viz
      version: "2026.6.3"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: Secret
    name: linkerd-webhook-issuer-cert
    valuesKey: tls.crt
    targetPath: tap.caBundle
  - kind: Secret
    name: linkerd-webhook-issuer-cert
    valuesKey: tls.crt
    targetPath: tapInjector.caBundle
  - kind: ConfigMap
    name: "linkerd-viz-helm-values"
    valuesKey: values.yaml
