---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  namespace: "linkerd-viz"
  name: "linkerd-viz-helm-values"
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system
  path: "/manifests/linkerd-viz/linkerd-viz-helm-values"
  targetNamespace: "linkerd-viz"
  healthChecks:
  - apiVersion: v1
    kind: ConfigMap
    namespace: "linkerd-viz"
    name: "linkerd-viz-helm-values"
