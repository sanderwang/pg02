---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: "kubenuts"
  name: "external-dns"
spec:
  interval: 15m
  timeout: 10m
  releaseName: "external-dns"
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        namespace: "kubenuts"
        name: "external-dns"
      chart: external-dns
      version: "1.21.1"
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  valuesFrom:
  - kind: ConfigMap
    name: "external-dns-helm-values"
    valuesKey: values.yaml
